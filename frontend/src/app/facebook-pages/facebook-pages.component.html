<div class="page-container" style="padding: 24px;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
    <div>
      <h1>Facebook Pages</h1>
      <p>Select a Meta page to view and sync its leads</p>
    </div>

    <div>
      <button *ngIf="!metaConnected" mat-stroked-button color="primary" (click)="connectFacebook()">
        <mat-icon>link</mat-icon> Connect Facebook
      </button>
      <button *ngIf="metaConnected" mat-raised-button color="primary" (click)="loadPages()" [disabled]="isLoading">
        <mat-icon>sync</mat-icon> {{ isLoading ? 'Syncing Pages...' : 'Sync Pages' }}
      </button>
    </div>
  </div>

  <mat-card>
    <table mat-table [dataSource]="pages" style="width: 100%;">
      <ng-container matColumnDef="pageId">
        <th mat-header-cell *matHeaderCellDef> Page ID </th>
        <td mat-cell *matCellDef="let page"> {{page.pageId}} </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Page Name </th>
        <td mat-cell *matCellDef="let page"> <strong>{{page.name}}</strong> </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Action </th>
        <td mat-cell *matCellDef="let page">
          <button mat-flat-button color="accent" (click)="viewLeads(page.pageId)">
            View Leads
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      
      <tr matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length" style="padding: 20px; text-align: center;">
          {{ isLoading ? 'Loading pages...' : 'No pages found. Please sync your account.' }}
        </td>
      </tr>
    </table>
  </mat-card>
</div>
